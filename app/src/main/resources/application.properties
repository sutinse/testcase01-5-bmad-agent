quarkus.http.host=127.0.0.1
quarkus.log.console.json.enabled=true
mp.jwt.verify.publickey=${LOCAL_JWT_PUBLIC_KEY:}
mp.jwt.verify.issuer=${LOCAL_JWT_ISSUER:}
mp.jwt.verify.audiences=${LOCAL_JWT_AUDIENCE:}
smallrye.jwt.required.claims=exp
smallrye.jwt.require.named-principal=false
quarkus.http.auth.permission.validated-claims.paths=/api/v1/refund-approval-checks,/api/v1/refund-approval-checks/*
quarkus.http.auth.permission.validated-claims.policy=validated-claims
%test.quarkus.http.auth.permission.test-claims.paths=/test/claims,/test/claims/*
%test.quarkus.http.auth.permission.test-claims.policy=validated-claims